# One command to a working stack: `docker compose up`.
# Postgres carries BOTH legs of hybrid retrieval — pgvector for the dense leg,
# Polish full-text search for the BM25 leg — which is why there is no separate
# vector-database service here.

services:
  db:
    # Built rather than pulled: the stock image has pgvector but no Polish
    # full-text configuration, and Postgres ships none. See docker/db/Dockerfile.
    build:
      context: .
      dockerfile: docker/db/Dockerfile
    image: kontrakt-guard-db:pg17-polish
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kontrakt_guard}
      POSTGRES_USER: ${POSTGRES_USER:-kontrakt}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kontrakt}
    ports:
      # Published on a non-standard host port on purpose. A locally installed
      # PostgreSQL is common on developer machines and binds 5432 first, so the
      # container silently loses the race and every connection lands on the wrong
      # server — which surfaces as "password authentication failed" rather than
      # as a port conflict, and costs an hour to diagnose.
      # The container port is unchanged, so the api service still uses 5432.
      - "${POSTGRES_HOST_PORT:-55432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # The API must not start against a database that is still initialising.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kontrakt} -d ${POSTGRES_DB:-kontrakt_guard}"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-kontrakt_guard}
      POSTGRES_USER: ${POSTGRES_USER:-kontrakt}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kontrakt}
      # Soft default rather than `:?`. A hard requirement here fails interpolation
      # for the whole file, so `docker compose up db` — which needs no API key —
      # cannot start either. The application reports a missing key when it first
      # needs one, which is both later and more precise.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-intfloat/multilingual-e5-large}
      EMBEDDING_REVISION: ${EMBEDDING_REVISION:-}
    ports:
      - "8000:8000"
    volumes:
      # Persist the embedding model between runs; re-downloading ~2 GB on every
      # `compose up` makes the quickstart look broken.
      - hfcache:/app/.cache/huggingface

volumes:
  pgdata:
  hfcache:
