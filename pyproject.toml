[project]
name = "kontrakt-guard"
version = "0.1.0"
description = "Polish employment contract auditor — LangGraph + hybrid RAG over pgvector, with citation-backed verdicts."
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = { text = "MIT" }
authors = [{ name = "Andrey Mazurchuk" }]

dependencies = [
    # Orchestration
    "langgraph>=0.2",
    "langchain-core>=0.3",
    "langchain-anthropic>=0.3",
    "anthropic>=0.40",
    # Embeddings (local, free, multilingual)
    "sentence-transformers>=3.3",
    "torch>=2.5",
    # Storage: Postgres carries BOTH legs of hybrid retrieval
    # (pgvector for dense, Polish full-text search for BM25).
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    # Serving
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.20",
    # Config & schemas
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    # Corpus acquisition & document parsing
    "httpx>=0.28",
    "lxml>=5.3",
    "beautifulsoup4>=4.12",
    "pypdf>=5.1",
    "python-docx>=1.1",
]

[dependency-groups]
dev = [
    "ruff>=0.8",
    "mypy>=1.14",
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "pytest-cov>=6.0",
    "pre-commit>=4.0",
    "types-beautifulsoup4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kontrakt_guard"]

# ---------------------------------------------------------------------------
# Lint / format. CI runs these exact invocations — see .pre-commit-config.yaml.
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "evals", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF", "ANN", "PTH"]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN"]

# ---------------------------------------------------------------------------
# Types
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["sentence_transformers.*", "pgvector.*", "langgraph.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# Tests. Integration tests need a live pgvector instance; evals cost API money.
# Both are opt-in so the default `pytest` run stays free and fast.
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers -m 'not integration and not llm'"
asyncio_mode = "auto"
markers = [
    "integration: requires a running Postgres+pgvector instance",
    "llm: makes billable Claude API calls",
]
